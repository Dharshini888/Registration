<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concert Registration Form</title>
</head>
<body>
  <h2>Concert Registration Form</h2>

  <form action="#" method="POST">
    <label for="fullname">Full Name:</label><br>
    <input type="text" id="fullname" name="fullname" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="phone">Phone Number:</label><br>
    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required><br><br>

    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age" min="10" max="100" required><br><br>

    <label for="ticket">Ticket Type:</label><br>
    <select id="ticket" name="ticket" required>
      <option value="">-- Select Ticket Type --</option>
      <option value="general">General Admission</option>
      <option value="vip">VIP</option>
      <option value="backstage">Backstage Pass</option>
    </select><br><br>

    <label for="notes">Special Requests / Notes:</label><br>
    <textarea id="notes" name="notes" rows="4" cols="40"></textarea><br><br>

    <input type="submit" value="Register">
  </form>
</body>
</html>
